name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: chs_test
          POSTGRES_USER: chs
          POSTGRES_PASSWORD: chs-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chs -d chs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL migrations and constraints
        run: pnpm db:test
        env:
          DATABASE_TEST_URL: postgresql://chs:chs-ci-only@localhost:5432/chs_test

      - name: Rehearse PostgreSQL backup and restore
        run: pnpm db:rehearse
        env:
          DATABASE_TEST_URL: postgresql://chs:chs-ci-only@localhost:5432/chs_test
          DATABASE_REHEARSAL_CONTAINER_ID: ${{ job.services.postgres.id }}

      - name: Upload backup and restore evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: postgres-backup-restore-evidence
          path: packages/database/rehearsal-results/backup-restore-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test bounded API load profiles
        run: pnpm test:load
        env:
          DATABASE_TEST_URL: postgresql://chs:chs-ci-only@localhost:5432/chs_test

      - name: Upload API load evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: api-load-evidence
          path: apps/api/load-results/api-load-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Install Chromium for browser tests
        run: pnpm --filter @chs/operations-web exec playwright install --with-deps chromium

      - name: Test operations browser workflows
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: operations-web-playwright
          path: |
            apps/operations-web/playwright-report
            apps/operations-web/test-results
          if-no-files-found: ignore
          retention-days: 7
